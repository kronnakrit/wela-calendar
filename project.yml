name: Wela
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  WelaCore:
    path: Packages/WelaCore
  WelaSync:
    path: Packages/WelaSync
  WelaUI:
    path: Packages/WelaUI
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 1.4.0
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: 1.7.0
targets:
  Wela:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: WelaCore
      - package: WelaSync
      - package: WelaUI
      - package: KeyboardShortcuts
      - package: MSAL
      - package: AppAuth
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Wela
        CFBundleDisplayName: Wela Calendar
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        MSClientID: $(MS_CLIENT_ID)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        GoogleRedirectScheme: $(GOOGLE_REDIRECT_SCHEME)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth-redirect
            CFBundleURLSchemes:
              - $(GOOGLE_REDIRECT_SCHEME)
          - CFBundleURLName: microsoft-auth-redirect
            CFBundleURLSchemes:
              - msauth.$(WELA_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WELA_BUNDLE_ID)
        PRODUCT_NAME: Wela
        CODE_SIGN_ENTITLEMENTS: $(WELA_ENTITLEMENTS)
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  WelaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Wela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WELA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: true
  # iOS: one universal app (iPhone + iPad) plus its widget extension.
  WelaiOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Shared
      - path: iOS/Resources
        buildPhase: resources
      - App/AppActions.swift
      - App/Auth
      - App/NotificationScheduler.swift
    dependencies:
      - package: WelaCore
      - package: WelaSync
      - package: WelaUI
      - package: MSAL
      - package: AppAuth
      - target: WelaWidgets
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleName: Wela
        CFBundleDisplayName: Wela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # No UIRequiresFullScreen and every orientation on iPad, so Split View and Slide Over work.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        # canOpenURL checks: MSAL's broker (Microsoft Authenticator) and native meeting apps.
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
          - msteams
          - zoommtg
        MSClientID: $(MS_CLIENT_ID)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        GoogleRedirectScheme: $(GOOGLE_REDIRECT_SCHEME)
        WelaAppGroup: $(WELA_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth-redirect
            CFBundleURLSchemes:
              - $(GOOGLE_REDIRECT_SCHEME)
          - CFBundleURLName: microsoft-auth-redirect
            CFBundleURLSchemes:
              - msauth.$(PRODUCT_BUNDLE_IDENTIFIER)
          - CFBundleURLName: wela-links
            CFBundleURLSchemes:
              - wela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WELA_BUNDLE_ID)
        PRODUCT_NAME: Wela
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: iOS/App/Wela.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Mac has its own app; don't also offer the iPad build on Apple silicon Macs.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
  WelaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Widgets
        excludes:
          - PrivacyInfo.xcprivacy
      - path: iOS/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - iOS/Shared
    dependencies:
      - package: WelaCore
      - package: WelaUI
      - sdk: WidgetKit.framework
    info:
      path: iOS/Widgets/Info.plist
      properties:
        CFBundleName: WelaWidgets
        CFBundleDisplayName: Wela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WelaAppGroup: $(WELA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WELA_BUNDLE_ID).widgets
        PRODUCT_NAME: WelaWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: iOS/Widgets/Widgets.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
schemes:
  WelaiOS:
    build:
      targets:
        WelaiOS: all
        WelaWidgets: all
    run:
      commandLineArguments:
        "-UseMockData": true
    archive:
      config: Release
  Wela:
    build:
      targets:
        Wela: all
    run:
      commandLineArguments:
        "-UseMockData": true
    test:
      targets:
        - WelaAppTests
