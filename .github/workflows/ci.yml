name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Package tests
        run: |
          for p in Packages/WelaCore Packages/WelaSync Packages/WelaUI; do
            WELA_SCREENSHOT_DIR="$PWD/screenshots" swift test --package-path "$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - name: Publish screenshots branch
        if: github.event_name == 'push' && hashFiles('screenshots/*.png') != ''
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.png
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Generate project
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig && xcodegen generate
      - name: Build and test app
        run: |
          xcodebuild test -project Wela.xcodeproj -scheme Wela -destination 'platform=macOS' \
            -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig && xcodegen generate
      - name: Build app and widgets (Simulator, Debug)
        run: |
          xcodebuild build -project Wela.xcodeproj -scheme WelaiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Build app and widgets (device, Release, unsigned)
        run: |
          xcodebuild build -project Wela.xcodeproj -scheme WelaiOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Simulator screenshots (iPhone, iPad)
        run: |
          scripts/ios-screenshots.sh \
            DerivedData/Build/Products/Debug-iphonesimulator/Wela.app ios-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios-screenshots/*.png
          if-no-files-found: warn
      - name: Publish iOS screenshots branch
        if: github.event_name == 'push' && hashFiles('ios-screenshots/*.png') != ''
        run: |
          cd ios-screenshots
          git init -q -b ci-screenshots-ios
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.png
          git commit -qm "iOS screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots-ios

  # Foldable iPhone simulator: needs the newest Xcode on the runner; advisory until it settles.
  ios-foldable:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig && xcodegen generate
      - name: Foldable screenshots
        run: scripts/ios-fold-screenshots.sh fold-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: fold-screenshots
          path: fold-screenshots/*.png
          if-no-files-found: warn
      - name: Publish foldable screenshots branch
        if: github.event_name == 'push' && hashFiles('fold-screenshots/*.png') != ''
        run: |
          cd fold-screenshots
          git init -q -b ci-screenshots-fold
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.png
          git commit -qm "Foldable screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots-fold

  lint:
    runs-on: macos-15
    continue-on-error: true # advisory until the formatting baseline is clean
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - run: brew install swift-format
      - name: Auto-format (branch pushes only)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          swift-format format --in-place --recursive App AppTests iOS Packages/*/Sources Packages/*/Tests
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -qam "Apply swift-format"
            git push -q origin HEAD:${{ github.ref_name }}
          fi
      - run: make lint
