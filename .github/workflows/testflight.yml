name: TestFlight
# Manual: Actions → TestFlight → Run workflow. Archives the iOS app, signs it with Xcode's
# cloud-managed signing and uploads it to App Store Connect. Setup is in docs/IOS.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          SECRETS_XCCONFIG: ${{ secrets.WELA_SECRETS_XCCONFIG }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$ASC_KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          [ -n "$SECRETS_XCCONFIG" ] || missing="$missing WELA_SECRETS_XCCONFIG"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          printf '%s\n' "$SECRETS_XCCONFIG" > Config/Secrets.xcconfig
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive
        run: |
          xcodebuild archive -project Wela.xcodeproj -scheme WelaiOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Wela-iOS.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive -archivePath build/Wela-iOS.xcarchive \
            -exportOptionsPlist iOS/ExportOptions.plist -exportPath build/ios-export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" Config/Secrets.xcconfig
